<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column;
           align-items: center; min-height: 100vh;
           font-family: monospace; color: white; padding: 12px; }
    video { width: 100%; max-width: 1280px; }
    #log { margin-top: 16px; width: 100%; max-width: 1280px;
           font-size: 13px; line-height: 1.8; }
    .ok   { color: #4caf50; }
    .warn { color: #ff9800; }
    .err  { color: #f44336; }
    .info { color: #90caf9; }
  </style>
</head>
<body>
  <video id="video" controls playsinline></video>
  <div id="log"></div>

  <script>
    const log = document.getElementById('log');
    function out(msg, type = 'info') {
      const d = document.createElement('div');
      d.className = type;
      d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      log.appendChild(d);
    }

    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('url');
    const targetParam = params.get('target');
    const offsetParam = params.get('offset');

    out(`URL-Parameter url: ${streamUrl ? '✓' : '✗ FEHLT'}`, streamUrl ? 'ok' : 'err');
    out(`Target: ${targetParam || '–'}   Offset: ${offsetParam || '–'}`);

    function calcOffset() {
      if (offsetParam) return parseInt(offsetParam);
      if (targetParam) {
        const [h, m] = targetParam.split(':').map(Number);
        const now = new Date();
        const target = new Date();
        target.setHours(h, m, 0, 0);
        const diff = Math.floor((now - target) / 1000);
        out(`Berechneter Versatz: ${diff}s (${Math.floor(diff/60)}m ${diff%60}s)`);
        return diff;
      }
      return 0;
    }

    if (!streamUrl) {
      out('Kein Stream-URL angegeben!', 'err');
    } else {
      const video = document.getElementById('video');
      const offset = calcOffset();

      out(`hls.js unterstützt: ${Hls.isSupported()}`);
      out(`Native HLS (Safari): ${!!video.canPlayType('application/vnd.apple.mpegurl')}`);

      if (Hls.isSupported()) {
        out('Nutze hls.js...');
        const hls = new Hls({ liveSyncDurationCount: 10, debug: false });

        hls.on(Hls.Events.ERROR, (event, data) => {
          out(`HLS Fehler: ${data.type} / ${data.details} / fatal: ${data.fatal}`, 'err');
          if (data.response) out(`HTTP Status: ${data.response.code}`, 'err');
        });

        hls.on(Hls.Events.MANIFEST_LOADING, () => out('Lade Manifest...'));
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          out('Manifest geladen ✓', 'ok');
          const seekEnd = video.seekable.length ? video.seekable.end(0) : null;
          out(`seekable.end(0): ${seekEnd}`);
          out(`duration: ${video.duration}`);

          if (seekEnd !== null && offset > 0) {
            const target = seekEnd - offset;
            out(`Springe zu: ${target.toFixed(1)}s`);
            video.currentTime = target;
          }
          video.play().then(() => out('Playback gestartet ✓', 'ok'))
                      .catch(e => out(`Play-Fehler: ${e.message}`, 'err'));
        });

        hls.loadSource(decodeURIComponent(streamUrl));
        hls.attachMedia(video);

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        out('Nutze nativen Safari HLS...');
        video.src = decodeURIComponent(streamUrl);
        video.addEventListener('loadedmetadata', () => {
          out('Metadata geladen ✓', 'ok');
          out(`duration: ${video.duration}   seekable.end: ${video.seekable.end(0)}`);
          if (offset > 0) {
            video.currentTime = video.seekable.end(0) - offset;
          }
          video.play().catch(e => out(`Play-Fehler: ${e.message}`, 'err'));
        });
        video.addEventListener('error', e => {
          out(`Video Fehler: ${video.error?.message || e}`, 'err');
        });
      } else {
        out('HLS wird nicht unterstützt!', 'err');
      }
    }
  </script>
</body>
</html>
